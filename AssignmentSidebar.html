<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 8px;
      color: #202124;
    }
    h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
    }
    #status {
      margin-bottom: 8px;
      color: #5f6368;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 4px 4px;
      border-bottom: 1px solid #e0e0e0;
      vertical-align: middle;
    }
    th {
      font-size: 11px;
      color: #5f6368;
      font-weight: normal;
    }
    .ac-reg {
      font-weight: bold;
      white-space: nowrap;
    }
    .from-display {
      white-space: nowrap;
      color: #5f6368;
    }
    .row-saving .assign-summary {
      opacity: 0.5;
    }
    .row-error {
      background: #fdecea;
    }
    #empty {
      color: #5f6368;
      display: none;
    }
    .assign-summary {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 12px;
      color: #202124;
      cursor: pointer;
    }
    .assign-summary.unassigned {
      color: #5f6368;
      font-style: italic;
    }
    .assign-panel {
      display: none;
      margin-top: 4px;
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 4px 6px;
      background: #fafafa;
    }
    .assign-panel.open {
      display: block;
    }
    .assign-panel label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      font-size: 12px;
      cursor: pointer;
    }
    .assign-panel input {
      margin: 0;
    }
  </style>
</head>
<body>
  <h4 id="sheetName">Assign Personnel</h4>
  <div id="status">Loading...</div>
  <div id="empty">No assignable WPs found on this sheet. Run "Update A/C Schedules" first.</div>
  <table id="wpTable" style="display:none">
    <thead>
      <tr>
        <th>AC Reg</th>
        <th>Check</th>
        <th>Start (Bangkok)</th>
        <th>Assigned</th>
      </tr>
    </thead>
    <tbody id="wpTableBody"></tbody>
  </table>

  <script>
    var personnelNames = [];

    function summaryText(names) {
      return names.length ? names.join(", ") : "— Unassigned — (tap to assign)";
    }

    // Builds the "current assignees" button plus its checkbox panel (all closed by default).
    // Selection is always from the Personel info list, so there's nothing to type or mistype.
    function buildAssignCell(pjid, assignedPeople) {
      var wrapper = document.createElement("div");

      var summary = document.createElement("button");
      summary.type = "button";
      summary.className = "assign-summary" + (assignedPeople.length ? "" : " unassigned");
      summary.textContent = summaryText(assignedPeople);
      wrapper.appendChild(summary);

      var panel = document.createElement("div");
      panel.className = "assign-panel";

      personnelNames.forEach(function (name) {
        var label = document.createElement("label");
        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = name;
        checkbox.checked = assignedPeople.indexOf(name) !== -1;
        checkbox.addEventListener("change", function () {
          onAssignmentChange(pjid, wrapper, summary, panel);
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(name));
        panel.appendChild(label);
      });

      // Keep any stray legacy value (e.g. typed directly on the sheet before this existed,
      // or not in the Personel info sheet) visible and selected, even though it can't be
      // re-checked from this list.
      assignedPeople.forEach(function (name) {
        if (personnelNames.indexOf(name) === -1) {
          var extraLabel = document.createElement("label");
          var extraCheckbox = document.createElement("input");
          extraCheckbox.type = "checkbox";
          extraCheckbox.value = name;
          extraCheckbox.checked = true;
          extraCheckbox.addEventListener("change", function () {
            onAssignmentChange(pjid, wrapper, summary, panel);
          });
          extraLabel.appendChild(extraCheckbox);
          extraLabel.appendChild(document.createTextNode(name + " (not in Personel info)"));
          panel.appendChild(extraLabel);
        }
      });

      summary.addEventListener("click", function () {
        panel.classList.toggle("open");
      });

      wrapper.appendChild(panel);
      return wrapper;
    }

    function onAssignmentChange(pjid, row, summary, panel) {
      var checkedNames = Array.prototype.slice.call(panel.querySelectorAll("input:checked")).map(function (cb) {
        return cb.value;
      });

      row.classList.add("row-saving");
      row.classList.remove("row-error");
      google.script.run
        .withSuccessHandler(function (result) {
          row.classList.remove("row-saving");
          summary.textContent = summaryText(result.assignedPeople);
          summary.classList.toggle("unassigned", result.assignedPeople.length === 0);
        })
        .withFailureHandler(function (err) {
          row.classList.remove("row-saving");
          row.classList.add("row-error");
          alert("Couldn't save assignment: " + (err && err.message ? err.message : err));
        })
        .applyAssignment(pjid, checkedNames);
    }

    function render(data) {
      personnelNames = data.personnel || [];
      document.getElementById("sheetName").textContent = "Assign Personnel — " + data.sheetName;
      document.getElementById("status").textContent = data.wps.length + " WP(s)";

      var tbody = document.getElementById("wpTableBody");
      tbody.innerHTML = "";

      if (data.wps.length === 0) {
        document.getElementById("empty").style.display = "block";
        document.getElementById("wpTable").style.display = "none";
        return;
      }

      document.getElementById("empty").style.display = "none";
      document.getElementById("wpTable").style.display = "table";

      data.wps.forEach(function (wp) {
        var tr = document.createElement("tr");

        var acRegTd = document.createElement("td");
        acRegTd.className = "ac-reg";
        acRegTd.textContent = wp.acReg;
        tr.appendChild(acRegTd);

        var checkTd = document.createElement("td");
        checkTd.textContent = wp.acCheck;
        tr.appendChild(checkTd);

        var fromTd = document.createElement("td");
        fromTd.className = "from-display";
        fromTd.textContent = wp.fromDisplay;
        tr.appendChild(fromTd);

        var assignTd = document.createElement("td");
        assignTd.appendChild(buildAssignCell(wp.pjid, wp.assignedPeople || []));
        tr.appendChild(assignTd);

        tbody.appendChild(tr);
      });
    }

    function showError(err) {
      document.getElementById("status").textContent = "Failed to load: " + (err && err.message ? err.message : err);
    }

    google.script.run.withSuccessHandler(render).withFailureHandler(showError).getAssignmentSidebarData();
  </script>
</body>
</html>
